name: Build Admin APK

# শুধু ম্যানুয়ালি চলবে (GitHub → Actions → Build Admin APK → Run workflow, ব্রান্চ main)।
# Smart Feni Admin = com.smartfeni.admin, অ্যাপ খুললে শুরু হয় https://smartfeni.com/console।
# বিতরণ: Google Play Internal testing (স্টাফদের Gmail তালিকা) — তাই AAB বানায় (smart-feni-admin-aab)।
# Play-তে নতুন ভার্সন দিলে অ্যাপ নিজেই Play-এর আপডেট ডায়ালগ দেখায় (native-bridge.js checkForAppUpdate)।
# পাশাপাশি সাইন করা APK-ও থাকে (smart-feni-admin-apk), দরকারে সরাসরি দেওয়ার জন্য।
# versionCode = এই workflow-এর run নম্বর, প্রতি রানে বাড়ে (Play-তে আগেরটার চেয়ে বড় হতে হয়)।
# রিপোর কোনো ফাইল বদলায় না: সব বদল শুধু এই বিল্ডের অস্থায়ী কপিতে (মেইন অ্যাপ অক্ষত)।
# নেটিভ কিছু (আইকন, প্লাগিন, AndroidManifest) বদলালে তবেই আবার চালান;
# src/ এর ওয়েব বদল Vercel ডেপ্লয়েই অ্যাপে পৌঁছে যায়।
# অ্যাডমিন নোটিফিকেশন (/admin/*, /console/*) এই অ্যাপ ইনস্টল থাকলে এখানেই যায় (src/pages/api/push/send.ts)।
# লাগে (GitHub Secrets): KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD,
# GOOGLE_SERVICES_ADMIN_JSON_BASE64 (একই Firebase প্রজেক্টে com.smartfeni.admin যোগ করে নামানো google-services.json, Base64)
# আইকন/স্প্ল্যাশ/নোটিফিকেশন আইকন: admin-assets/res/** -> android/app/src/main/res/ (শুধু এই বিল্ডে)
on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Check required secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          GS_B64: ${{ secrets.GOOGLE_SERVICES_ADMIN_JSON_BASE64 }}
        run: |
          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD GS_B64; do
            if [ -z "${!v}" ]; then
              echo "::error::Secret মিসিং: $v (GS_B64 = GOOGLE_SERVICES_ADMIN_JSON_BASE64)"
              exit 1
            fi
          done

      - name: Install dependencies
        run: npm ci

      - name: Switch Capacitor config to Admin
        run: |
          jq '.appId = "com.smartfeni.admin" | .appName = "Smart Feni Admin" | .server.url = "https://smartfeni.com/console"' capacitor.config.json > capacitor.config.admin.json
          mv capacitor.config.admin.json capacitor.config.json
          jq -e '.appId == "com.smartfeni.admin" and .server.url == "https://smartfeni.com/console"' capacitor.config.json > /dev/null
          # এরর পেজের "হোম"/ফলব্যাক মেইন হোম নয়, /console (শুধু এই বিল্ডের কপিতে)
          sed -i "s|var HOME = 'https://smartfeni.com/';|var HOME = 'https://smartfeni.com/console';|" www/error.html
          grep -q "var HOME = 'https://smartfeni.com/console';" www/error.html

      - name: Ensure Android assets directory exists
        run: mkdir -p android/app/src/main/assets

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Write Admin google-services.json
        env:
          GS_B64: ${{ secrets.GOOGLE_SERVICES_ADMIN_JSON_BASE64 }}
        run: |
          echo "$GS_B64" | base64 -d > android/app/google-services.json
          if ! jq -e '[.client[].client_info.android_client_info.package_name] | index("com.smartfeni.admin")' android/app/google-services.json > /dev/null; then
            echo "::error::google-services.json-এ com.smartfeni.admin নেই। Firebase-এ (একই প্রজেক্ট) Android অ্যাপ com.smartfeni.admin যোগ করে নতুন ফাইল নামিয়ে secret আবার বসান।"
            exit 1
          fi

      - name: Switch Android project to Admin (temporary copy only)
        run: |
          # build.gradle: applicationId (namespace ও Java প্যাকেজ বদলাবে না), versionCode/versionName
          sed -i 's/applicationId "com.smartfeni.app"/applicationId "com.smartfeni.admin"/' android/app/build.gradle
          sed -i 's/versionCode [0-9][0-9]*/versionCode ${{ github.run_number }}/' android/app/build.gradle
          sed -i 's/versionName "[^"]*"/versionName "admin-1.0.${{ github.run_number }}"/' android/app/build.gradle

          # strings.xml: অ্যাপের নাম ও প্যাকেজ
          sed -i -e 's|>Smart Feni<|>Smart Feni Admin<|g' -e 's|com\.smartfeni\.app|com.smartfeni.admin|g' android/app/src/main/res/values/strings.xml

          # AndroidManifest: smartfeni.com App Links বাদ (নইলে মেইন অ্যাপের সাথে লিংক খোলায় দ্বন্দ্ব)
          python3 - <<'PY'
          import re, sys
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()
          new, n = re.subn(r'<intent-filter android:autoVerify="true">.*?</intent-filter>', '', s, flags=re.S)
          if n != 1:
              print('ERROR: autoVerify intent-filter %d বার পাওয়া গেছে (১ বার হওয়ার কথা)' % n)
              sys.exit(1)
          open(p, 'w', encoding='utf-8').write(new)
          PY

          # যাচাই
          grep -q 'applicationId "com.smartfeni.admin"' android/app/build.gradle
          grep -q 'versionCode ${{ github.run_number }}' android/app/build.gradle
          grep -q '>Smart Feni Admin<' android/app/src/main/res/values/strings.xml
          if grep -q 'android:autoVerify' android/app/src/main/AndroidManifest.xml; then
            echo "::error::autoVerify এখনো আছে"
            exit 1
          fi
          grep -n 'applicationId\|versionCode\|versionName' android/app/build.gradle

      - name: Apply Admin icon, splash and notification icon
        run: |
          # admin-assets/res (রিপোতে) -> android/app/src/main/res (শুধু এই বিল্ডে, মেইন অ্যাপ অক্ষত)
          if [ ! -d admin-assets/res ]; then
            echo "::error::admin-assets/res নেই।"
            exit 1
          fi
          cp -r admin-assets/res/. android/app/src/main/res/

          # যাচাই
          test -s android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png
          test -s android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          test -s android/app/src/main/res/drawable-xxxhdpi/ic_stat_smartfeni.png
          test -s android/app/src/main/res/drawable-port-xhdpi/splash.png
          test -s android/app/src/main/res/drawable/splash.png
          cmp admin-assets/res/drawable/splash.png android/app/src/main/res/drawable/splash.png

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$GITHUB_WORKSPACE/android/app/signing.keystore"

      - name: Build signed release AAB + APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew bundleRelease assembleRelease \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/android/app/signing.keystore" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Upload Admin AAB artifact (Play Console-এ আপলোডের জন্য)
        uses: actions/upload-artifact@v4
        with:
          name: smart-feni-admin-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Upload Admin APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: smart-feni-admin-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Clean up keystore and Firebase file
        if: always()
        run: |
          rm -f "$GITHUB_WORKSPACE/android/app/signing.keystore"
          rm -f "$GITHUB_WORKSPACE/android/app/google-services.json"
