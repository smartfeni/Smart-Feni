name: Scrape CNGLagbe Drivers

on:
  schedule:
    # প্রতিদিন বাংলাদেশ সময় রাত ৩টায় (UTC 21:00, আগের দিন)
    - cron: '0 21 * * *'
  workflow_dispatch: {}   # ম্যানুয়ালি "Run workflow" বাটনে চালানোর অপশন

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install @supabase/supabase-js playwright

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/scrape-cnglagbe.mjs