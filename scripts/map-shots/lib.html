<!DOCTYPE html>
<!--
  path: scripts/map-shots/lib.html
  আসল প্রোডাকশন পথ টেস্ট: Leaflet (public/vendor) + src/lib/baseMap.js addBaseMap() → স্মার্ট ফেনী
  ভেক্টর + বাংলা HTML লেবেল। ?z=জুম&lat=&lng=&poi=0
-->
<html lang="bn">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>baseMap lib shot</title>
<link rel="stylesheet" href="/public/vendor/leaflet-1.9.4/leaflet.css" />
<style>
  @font-face { font-family: 'Hind Siliguri'; font-weight: 400 500; src: url(/nm/@fontsource/hind-siliguri/files/hind-siliguri-bengali-400-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Hind Siliguri'; font-weight: 600; src: url(/nm/@fontsource/hind-siliguri/files/hind-siliguri-bengali-600-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Hind Siliguri'; font-weight: 700; src: url(/nm/@fontsource/hind-siliguri/files/hind-siliguri-bengali-700-normal.woff2) format('woff2'); }
  html, body, #map { margin: 0; height: 100%; }
  body { font-family: 'Hind Siliguri', sans-serif; }
  .card { position: absolute; top: 14px; left: 14px; right: 14px; z-index: 1000; background: #fff; border-radius: 18px; padding: 12px 16px 10px; box-shadow: 0 6px 22px rgba(27,42,74,.16); color: #1B2A4A; }
  .card b { display: block; font-size: 18px; } .card small { font-size: 13px; color: #5B6B86; }
</style>
</head>
<body>
<div id="map"></div>
<div class="card" id="card"><b>নতুন ম্যাপ · রাস্তা পর্যায়</b><small id="sub">লোড হচ্ছে</small></div>
<script src="/public/vendor/leaflet-1.9.4/leaflet.js"></script>
<script type="module">
import { addBaseMap } from '/src/lib/baseMap.js';
const q = new URLSearchParams(location.search);
const z = Number(q.get('z') || 15);
const map = L.map('map', { zoomControl: false, fadeAnimation: false, zoomAnimation: false }).setView([Number(q.get('lat') || 23.0128), Number(q.get('lng') || 91.3966)], z);
const res = await addBaseMap(L, map, { poi: q.get('poi') !== '0' });
document.getElementById('sub').textContent = 'জুম ' + z + ' · ' + (res.kind === 'vector' ? 'ভেক্টর + বাংলা HTML লেবেল (baseMap.js)' : 'রাস্টার ফলব্যাক!');
try { await document.fonts.ready; } catch (e) {}
setTimeout(() => { window.__ready = res.kind; }, 4000);
</script>
</body>
</html>
