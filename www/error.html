<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F8FAFC">
  <title>Smart Feni</title>
  <!--
    ফাইল: www/error.html
    কাজ: অ্যাপে ইন্টারনেট না থাকলে বা সার্ভার সাড়া না দিলে
         Android-এর ডিফল্ট "Web page not available" পেজের বদলে এটা দেখাবে।
    নোট: সব CSS/JS/আইকন ভেতরেই — কোনো বাইরের ফাইল লাগে না, তাই অফলাইনেও চলে।
         capacitor.config.json এ server.errorPath = "error.html" দিলে চালু হবে।
    আপডেট: এই পেজ দেখা গেলেই Splash screen (অ্যাপ আইকন) সরে যায়, যাতে
         সাইট লোড না হলেও আইকনের নিচে এরর পেজ আটকে না থাকে।
  -->
  <style>
    :root {
      --navy: #1B2A4A;
      --orange: #FF6B35;
      --bg: #F8FAFC;
      --muted: #55647F;
      --line: #D5DCE8;
    }

    * { box-sizing: border-box; margin: 0; }

    html, body { height: 100%; }

    body {
      background: var(--bg);
      color: var(--navy);
      font-family: system-ui, -apple-system, "Noto Sans Bengali", "Hind Siliguri", "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: calc(24px + env(safe-area-inset-top, 0px)) 24px calc(24px + env(safe-area-inset-bottom, 0px));
    }

    main {
      width: 100%;
      max-width: 340px;
    }

    .icon {
      display: block;
      width: 96px;
      height: 96px;
      margin: 0 auto 28px;
    }

    h1 {
      font-size: 1.5rem;
      line-height: 1.4;
      font-weight: 700;
      margin-bottom: 10px;
    }

    #desc {
      font-size: 1rem;
      line-height: 1.7;
      color: var(--muted);
      margin-bottom: 32px;
    }

    #hint {
      display: none;
      font-size: 0.9375rem;
      line-height: 1.7;
      color: var(--navy);
      background: #FFF4EC;
      border: 1px solid #FFD9C7;
      border-radius: 14px;
      padding: 12px 14px;
      margin: -14px 0 24px;
      text-align: left;
    }

    #hint.show { display: block; }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    button {
      font: inherit;
      font-size: 1.0625rem;
      font-weight: 600;
      min-height: 52px;
      border-radius: 16px;
      padding: 0 20px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    #retry {
      background: var(--navy);
      color: #fff;
      border: 2px solid var(--navy);
    }

    #retry:disabled {
      opacity: 0.7;
      cursor: default;
    }

    #home {
      background: transparent;
      color: var(--navy);
      border: 2px solid var(--line);
    }

    button:focus-visible {
      outline: 3px solid var(--orange);
      outline-offset: 2px;
    }

    .brand {
      margin-top: 40px;
      font-size: 0.875rem;
      color: var(--muted);
      line-height: 1.6;
    }

    .brand strong {
      display: block;
      color: var(--navy);
      font-size: 1rem;
    }

    #report {
      background: transparent;
      color: var(--muted);
      border: 2px dashed var(--line);
      min-height: 46px;
      font-size: 0.9375rem;
    }

    #report:disabled {
      opacity: 0.7;
      cursor: default;
    }

    .wa-link {
      display: block;
      margin-top: 14px;
      color: var(--muted);
      font-size: 0.9375rem;
      font-weight: 600;
      text-decoration: underline;
    }

    @keyframes nudge {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }

    .nudge { animation: nudge 0.3s ease-in-out; }

    @media (prefers-reduced-motion: reduce) {
      .nudge { animation: none; }
    }
  </style>
</head>
<body>
  <main>
    <svg class="icon" viewBox="0 0 96 96" aria-hidden="true">
      <g fill="none" stroke="#1B2A4A" stroke-width="6" stroke-linecap="round">
        <path d="M14 38a48 48 0 0 1 68 0"/>
        <path d="M27 51a30 30 0 0 1 42 0"/>
        <path d="M39 63a13 13 0 0 1 18 0"/>
      </g>
      <circle cx="48" cy="75" r="4.5" fill="#1B2A4A"/>
      <path d="M18 14L80 82" stroke="#F8FAFC" stroke-width="14" stroke-linecap="round"/>
      <path d="M18 14L80 82" stroke="#FF6B35" stroke-width="6" stroke-linecap="round"/>
    </svg>

    <h1 id="title">পেজটি খোলা যাচ্ছে না</h1>
    <p id="desc" role="status" aria-live="polite">আমাদের সার্ভারে পৌঁছানো যাচ্ছে না। কিছুক্ষণ পর আবার চেষ্টা করুন।</p>

    <p id="hint" role="status" aria-live="polite"></p>

    <div class="actions">
      <button id="retry" type="button">আবার চেষ্টা করুন</button>
      <button id="home" type="button">হোমে যান</button>
      <button id="report" type="button">সমস্যা জানান</button>
    </div>

    <a id="wa" class="wa-link" href="https://wa.me/8801816355833?text=%E0%A6%B8%E0%A7%8D%E0%A6%AE%E0%A6%BE%E0%A6%B0%E0%A7%8D%E0%A6%9F%20%E0%A6%AB%E0%A7%87%E0%A6%A8%E0%A7%80%20%E0%A6%85%E0%A7%8D%E0%A6%AF%E0%A6%BE%E0%A6%AA%20%E0%A6%96%E0%A7%81%E0%A6%B2%E0%A6%9B%E0%A7%87%20%E0%A6%A8%E0%A6%BE%E0%A5%A4%20%E0%A6%AB%E0%A7%8B%E0%A6%A8%E0%A7%87%E0%A6%B0%20%E0%A6%AE%E0%A6%A1%E0%A7%87%E0%A6%B2%3A%20" target="_blank" rel="noopener">হোয়াটসঅ্যাপে জানান</a>

    <p class="brand">
      <strong>স্মার্ট ফেনী</strong>
      প্রয়োজন আপনার, দায়িত্ব আমাদের
    </p>
  </main>

  <script>
    (function () {
      var HOME = 'https://smartfeni.com/';
      var KEY = 'sf_last_url'; // native-bridge.js এই key-তে শেষ দেখা পেজ সেভ করে
      var going = false;

      var titleEl = document.getElementById('title');
      var descEl = document.getElementById('desc');
      var retryBtn = document.getElementById('retry');
      var homeBtn = document.getElementById('home');
      var reportBtn = document.getElementById('report');

      var TEXT = {
        offline: {
          title: 'ইন্টারনেট সংযোগ নেই',
          desc: 'মোবাইল ডেটা বা ওয়াই-ফাই চালু আছে কিনা দেখুন। সংযোগ ফিরলে অ্যাপ নিজেই আবার খুলবে।'
        },
        server: {
          title: 'পেজটি খোলা যাচ্ছে না',
          desc: 'আমাদের সার্ভারে পৌঁছানো যাচ্ছে না। কিছুক্ষণ পর আবার চেষ্টা করুন।'
        },
        back: {
          title: 'সংযোগ ফিরেছে',
          desc: 'পেজটি খোলা হচ্ছে…'
        }
      };

      function show(state) {
        titleEl.textContent = TEXT[state].title;
        descEl.textContent = TEXT[state].desc;
      }

      function nudge() {
        descEl.classList.remove('nudge');
        void descEl.offsetWidth;
        descEl.classList.add('nudge');
      }

      // Capacitor plugin নেওয়ার নিরাপদ উপায় (না পেলে null)
      function getPlugin(name) {
        try {
          var C = window.Capacitor;
          if (!C) return null;
          if (C.Plugins && C.Plugins[name]) return C.Plugins[name];
          if (typeof C.registerPlugin === 'function') return C.registerPlugin(name);
        } catch (e) {}
        return null;
      }

      // এরর পেজ দেখা গেলে Splash screen সরিয়ে দেয়
      function hideSplash() {
        try {
          var S = getPlugin('SplashScreen');
          if (!S || typeof S.hide !== 'function') return;
          var r = S.hide({ fadeOutDuration: 200 });
          if (r && typeof r.catch === 'function') r.catch(function () {});
        } catch (e) {}
      }

      // শুধু নিজের সাইটের URL-ই গ্রহণযোগ্য — অন্য কিছু হলে হোমে যাবে
      function safe(url) {
        try {
          var u = new URL(url);
          return u.origin === 'https://smartfeni.com' ? u.href : HOME;
        } catch (e) {
          return HOME;
        }
      }

      // Preferences থেকে শেষ দেখা পেজ পড়ে; না পেলে বা দেরি হলে হোম
      function getLastUrl() {
        return new Promise(function (resolve) {
          var done = false;
          function finish(u) {
            if (!done) { done = true; resolve(u || HOME); }
          }
          setTimeout(function () { finish(HOME); }, 1500);
          try {
            var P = getPlugin('Preferences');
            if (!P) { finish(HOME); return; }
            P.get({ key: KEY })
              .then(function (r) { finish(r && r.value ? safe(r.value) : HOME); })
              .catch(function () { finish(HOME); });
          } catch (e) {
            finish(HOME);
          }
        });
      }

      function go(url) {
        if (going) return;
        going = true;
        window.location.replace(url);
      }

      function tryOpen(getUrl) {
        if (going) return;
        if (!navigator.onLine) {
          show('offline');
          nudge();
          return;
        }
        retryBtn.disabled = true;
        retryBtn.textContent = 'চেষ্টা করছি…';
        getUrl().then(go);
      }

      retryBtn.addEventListener('click', function () { tryOpen(getLastUrl); });
      homeBtn.addEventListener('click', function () {
        tryOpen(function () { return Promise.resolve(HOME); });
      });

      // নেট ফিরলে নিজে থেকেই আবার খুলবে
      window.addEventListener('online', function () {
        if (going) return;
        show('back');
        getLastUrl().then(go);
      });

      window.addEventListener('offline', function () {
        if (going) return;
        show('offline');
      });

      // পেজ আবার দেখা গেলে (back চাপার পর) বাটন ঠিক করে দেয়
      window.addEventListener('pageshow', function () {
        going = false;
        retryBtn.disabled = false;
        retryBtn.textContent = 'আবার চেষ্টা করুন';
        show(navigator.onLine ? 'server' : 'offline');
      });

      show(navigator.onLine ? 'server' : 'offline');

      // Splash সরাও (Capacitor bridge তৈরি হতে দেরি হলে ০.৩ সেকেন্ড পরে আবার চেষ্টা)
      hideSplash();
      setTimeout(hideSplash, 300);

      // নেটিভ watchdog-কে জানাও: এরর পেজ দেখা গেছে (এই পেজ নিজেই রিপোর্ট করে, তাই watchdog আর লাগবে না)
      notifyNativeErrorShown();
      setTimeout(notifyNativeErrorShown, 300);

      // ============================================================
      // নিজে-নিজে কারণ খোঁজা (diagnosis)
      // এই পেজ দেখা মানে অ্যাপ smartfeni.com লোড করতে পারেনি। এখানে ৩টা সাইটে
      // পৌঁছানো যায় কিনা দেখে (আমাদের সাইট / Supabase / Google) কাস্টমারকে সঠিক
      // হিন্ট দেওয়া হয়, আর সাইটে না পৌঁছালে কারণটা Supabase-এ রিপোর্ট হয়
      // (/admin/errors-এ দেখা যাবে)। কোনো ব্যক্তিগত তথ্য পাঠানো হয় না।
      // ============================================================
      var SB_URL = 'https://hedloawcvnbleehnurqd.supabase.co';
      var SB_KEY = 'sb_publishable_T58iE-MmcLsM3I2bQ7vofQ_9c6CG3qx'; // পাবলিক (publishable) key
      var REPORT_KEY = 'sf_errpage_report_at';
      var REPORT_GAP_MS = 30 * 60 * 1000; // একই ফোন থেকে ৩০ মিনিটে একবারের বেশি রিপোর্ট নয়
      var hintEl = document.getElementById('hint');

      // উত্তর পেলেই (যেকোনো স্ট্যাটাস) "পৌঁছানো যায়"; এরর/টাইমআউটে না
      function reach(url) {
        return new Promise(function (resolve) {
          var done = false;
          var ctrl = (typeof AbortController === 'function') ? new AbortController() : null;
          function finish(v) {
            if (!done) { done = true; resolve(v); }
          }
          setTimeout(function () {
            if (ctrl) { try { ctrl.abort(); } catch (e) {} }
            finish(false);
          }, 12000);
          try {
            var opts = { mode: 'no-cors', cache: 'no-store' };
            if (ctrl) opts.signal = ctrl.signal;
            fetch(url + (url.indexOf('?') > -1 ? '&' : '?') + '_=' + Date.now(), opts)
              .then(function () { finish(true); })
              .catch(function () { finish(false); });
          } catch (e) {
            finish(false);
          }
        });
      }

      function deviceFromUA() {
        var ua = navigator.userAgent || '';
        var m = ua.match(/Android\s([\d.]+);\s*([^;)]*?)(?:\sBuild|[;)])/);
        return { android: m ? m[1] : '?', model: (m && m[2]) ? m[2].trim() : '?' };
      }

      // নতুন Chrome/WebView-এ UA-তে মডেল লুকানো থাকে ("K"), তাই userAgentData থেকে আসল মডেল নেওয়ার চেষ্টা
      function getDevice() {
        return new Promise(function (resolve) {
          var fb = deviceFromUA();
          try {
            if (navigator.userAgentData && navigator.userAgentData.getHighEntropyValues) {
              var t = setTimeout(function () { resolve(fb); }, 800);
              navigator.userAgentData.getHighEntropyValues(['model', 'platformVersion'])
                .then(function (v) {
                  clearTimeout(t);
                  resolve({
                    model: (v && v.model) ? v.model : fb.model,
                    android: (v && v.platformVersion) ? v.platformVersion : fb.android
                  });
                })
                .catch(function () { clearTimeout(t); resolve(fb); });
              return;
            }
          } catch (e) {}
          resolve(fb);
        });
      }

      // [health-v1] ---- অফলাইন-সেফ রিপোর্ট ----
      // নেটে সমস্যার সময়ই রিপোর্ট পাঠানো সবচেয়ে কঠিন। তাই আগে ফোনে রাখি (নেটিভ কিউ/localStorage),
      // তারপর পাঠাই; ব্যর্থ হলে নেট ফিরলে, ১০/৩০/৯০ সেকেন্ড পর, আর পরের বার এই পেজ খুললে আবার চেষ্টা।
      var Q_KEY = 'sf_errpage_q';
      var SESSION = String(Date.now());
      var flushing = false;
      var flushTries = 0;

      function qRead() {
        try {
          var a = JSON.parse(localStorage.getItem(Q_KEY) || '[]');
          return Array.isArray(a) ? a : [];
        } catch (e) { return []; }
      }

      function qWrite(a) {
        try { localStorage.setItem(Q_KEY, JSON.stringify(a.slice(-10))); } catch (e) {}
      }

      function devId() {
        try {
          var d = localStorage.getItem('sf_did');
          if (!d) {
            d = 'e' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
            localStorage.setItem('sf_did', d);
          }
          return d;
        } catch (e) { return 'unknown'; }
      }

      function sendItem(item) {
        var url = SB_URL + (item.k === 'h' ? '/rest/v1/rpc/log_client_health' : '/rest/v1/rpc/report_client_error');
        var body = item.k === 'h' ? { p_events: [item.b] } : item.b;
        return fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'apikey': SB_KEY },
          body: JSON.stringify(body)
        }).then(function (res) { return !!(res && res.ok); })
          .catch(function () { return false; });
      }

      function flushQueue() {
        if (flushing || navigator.onLine === false) return;
        var q = qRead();
        if (!q.length) return;
        flushing = true;
        sendItem(q[0]).then(function (ok) {
          flushing = false;
          if (ok) {
            var cur = qRead();
            cur.shift();
            qWrite(cur);
            flushTries = 0;
            if (cur.length) flushQueue();
          } else if (flushTries < 3) {
            var wait = [10000, 30000, 90000][flushTries];
            flushTries++;
            setTimeout(flushQueue, wait);
          }
        });
      }

      // নতুন AAB-তে নেটিভ প্লাগিন (SFHealth) থাকে: সেখানে দিলে প্রসেস মরলেও রিপোর্ট হারায় না।
      // না থাকলে localStorage কিউ। legacy = /admin/errors-এর পুরনো রিপোর্ট (আগের মতোই যায়)।
      function push(event, detail, legacy) {
        var net = navigator.onLine === false ? 'offline' : ((navigator.connection && navigator.connection.effectiveType) || null);
        var ev = { event: event, device_id: devId(), session_id: SESSION, platform: 'android_app', page: '/error.html', net_type: net, detail: detail };
        if (detail && detail.model) ev.device_model = detail.model;
        if (detail && detail.android) ev.os_version = detail.android;

        var q = qRead();
        var viaNative = false;
        var H = getPlugin('SFHealth');
        if (H && typeof H.report === 'function') {
          try {
            var r = H.report({ event: event, detail: detail });
            if (r && typeof r.catch === 'function') r.catch(function () {});
            viaNative = true;
          } catch (e) {}
        }
        if (!viaNative) q.push({ k: 'h', b: ev });
        if (legacy) q.push({ k: 'e', b: legacy });
        qWrite(q);
        flushQueue();
      }

      function notifyNativeErrorShown() {
        try {
          var H = getPlugin('SFHealth');
          if (H && typeof H.errorShown === 'function') {
            var r = H.errorShown();
            if (r && typeof r.catch === 'function') r.catch(function () {});
          }
        } catch (e) {}
      }

      function sendReport(site, sb, net) {
        try {
          var last = Number(localStorage.getItem(REPORT_KEY)) || 0;
          if (Date.now() - last < REPORT_GAP_MS) return;
          localStorage.setItem(REPORT_KEY, String(Date.now()));
        } catch (e) {}

        getDevice().then(function (d) {
          function b(v) { return v ? 'ok' : 'fail'; }
          var msg = 'site=' + b(site) + ' supabase=' + b(sb) + ' internet=' + b(net) +
            ' android=' + d.android + ' model=' + d.model;
          push('error_page', {
            site: b(site), supabase: b(sb), internet: b(net),
            android: d.android, model: d.model,
            online: navigator.onLine !== false, auto_attempts: autoAttempt
          }, {
            p_kind: 'other',
            p_page: '/error.html',
            p_action: 'app_load_fail',
            p_message: msg,
            p_title: 'অ্যাপে সাইট লোড হয়নি (error.html)',
            p_user_agent: navigator.userAgent
          });
        });
      }

      // ইউজার নিজে "সমস্যা জানান" চাপলে
      if (reportBtn) {
        reportBtn.addEventListener('click', function () {
          reportBtn.disabled = true;
          getDevice().then(function (d) {
            push('user_report', {
              topic: 'অ্যাপ/সাইট খুলছে না',
              note: 'error.html থেকে ইউজার নিজে জানিয়েছে',
              android: d.android, model: d.model,
              online: navigator.onLine !== false, auto_attempts: autoAttempt
            }, null);
            reportBtn.textContent = 'জানানো হয়েছে, ধন্যবাদ ✓';
          });
        });
      }

      window.addEventListener('online', function () {
        flushTries = 0;
        setTimeout(flushQueue, 1500);
      });

      // আগের বার (নেট না থাকায়) জমে থাকা রিপোর্ট পাঠানোর চেষ্টা
      flushQueue();

      function showHint(text) {
        if (!hintEl) return;
        hintEl.textContent = text;
        hintEl.classList.add('show');
      }

      function diagnose() {
        if (navigator.onLine === false) { sendReport(false, false, false); return; }
        Promise.all([
          reach(HOME + 'favicon.ico'),
          reach(SB_URL + '/auth/v1/health'),
          reach('https://www.gstatic.com/generate_204')
        ]).then(function (r) {
          if (going) return;
          var site = r[0], sb = r[1], net = r[2];
          if (site) return; // সাইটে পৌঁছানো যাচ্ছে — অটো-রিট্রাই নিজেই খুলে দেবে

          if (sb || net) {
            showHint('আপনার ইন্টারনেট চলছে, কিন্তু এই মুহূর্তে আমাদের সাইটে ঢুকতে পারছে না। এটা নেটওয়ার্কের সাময়িক সমস্যা হতে পারে — ঠিক হলেই অ্যাপ নিজে থেকে খুলবে। ওয়াই-ফাই/মোবাইল ডেটা বদলে দেখুন, আর Settings → Private DNS বন্ধ করে দেখুন।');
          } else {
            showHint('ফোন ইন্টারনেটে সংযোগ পাচ্ছে না। মোবাইল ডেটা/ওয়াই-ফাই দেখুন, আর Settings → Date & time → Automatic চালু আছে কিনা দেখুন।');
          }
          sendReport(site, sb, net);
        }).catch(function () {});
      }

      diagnose();


      // অটো-রিট্রাই: নিজে থেকেই কানেকশন যাচাই করে ফিরে যায় (৩, ৫, ৮, ১২, ২০ সেকেন্ড পর পর)।
      // মোট ১৫ বার (প্রায় ৩–৪ মিনিট), এরপর থামে — বাটন তখনও কাজ করে।
      var AUTO_DELAYS = [3000, 5000, 8000, 12000, 20000];
      var AUTO_MAX = 15;
      var autoAttempt = 0;
      var autoTimer = null;

      // সাইট পর্যন্ত পৌঁছানো যায় কিনা (no-cors: উত্তর পেলেই চলবে)
      function probe() {
        return new Promise(function (resolve) {
          if (navigator.onLine === false) { resolve(false); return; }
          var done = false;
          function finish(v) {
            if (!done) { done = true; resolve(v); }
          }
          setTimeout(function () { finish(false); }, 10000);
          try {
            fetch(HOME + 'favicon.ico?_=' + Date.now(), { mode: 'no-cors', cache: 'no-store' })
              .then(function () { finish(true); })
              .catch(function () { finish(false); });
          } catch (e) {
            finish(false);
          }
        });
      }

      function autoRetry() {
        clearTimeout(autoTimer);
        if (going || autoAttempt >= AUTO_MAX) return;
        var wait = AUTO_DELAYS[Math.min(autoAttempt, AUTO_DELAYS.length - 1)];
        autoAttempt++;
        autoTimer = setTimeout(function () {
          if (going) return;
          if (document.hidden) { autoAttempt--; autoRetry(); return; }
          probe().then(function (ok) {
            if (going) return;
            if (ok) {
              show('back');
              getLastUrl().then(go);
            } else {
              autoRetry();
            }
          });
        }, wait);
      }

      window.addEventListener('pageshow', function () {
        autoAttempt = 0;
        autoRetry();
      });
      autoRetry();
    })();
  </script>
</body>
</html>
