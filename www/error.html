<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F8FAFC">
  <title>অফলাইন — Smart Feni</title>
  <!--
    ফাইল: public/offline.html (O2)
    কাজ: sw.js এর networkFirstWithTimeout() ফলব্যাক — নেট না থাকলে এবং
         পেজটা আগে কখনো ক্যাশ না হয়ে থাকলে এটা দেখাবে (ওয়েবসাইট/PWA-তে)।
         www/error.html এর অ্যাপ-সংস্করণ, ডিজাইন একই রাখা হয়েছে।
    নোট: install ধাপেই sw.js এই ফাইলটা আগে থেকে ক্যাশে রাখে, তাই এই পেজ
         নিজেই সবসময় অফলাইনে পাওয়া যাবে।
  -->
  <style>
    :root {
      --navy: #1B2A4A;
      --orange: #FF6B35;
      --bg: #F8FAFC;
      --muted: #55647F;
      --line: #D5DCE8;
    }

    * { box-sizing: border-box; margin: 0; }

    html, body { height: 100%; }

    body {
      background: var(--bg);
      color: var(--navy);
      font-family: system-ui, -apple-system, "Noto Sans Bengali", "Hind Siliguri", "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: calc(24px + env(safe-area-inset-top, 0px)) 24px calc(24px + env(safe-area-inset-bottom, 0px));
    }

    main { width: 100%; max-width: 340px; }

    .icon { display: block; width: 96px; height: 96px; margin: 0 auto 28px; }

    h1 { font-size: 1.5rem; line-height: 1.4; font-weight: 700; margin-bottom: 10px; }

    p.desc { font-size: 1rem; line-height: 1.7; color: var(--muted); margin-bottom: 32px; }

    button {
      font: inherit;
      font-size: 1.0625rem;
      font-weight: 600;
      min-height: 52px;
      width: 100%;
      border-radius: 16px;
      padding: 0 20px;
      cursor: pointer;
      background: var(--navy);
      color: #fff;
      border: 2px solid var(--navy);
      -webkit-tap-highlight-color: transparent;
    }

    button:disabled { opacity: 0.7; cursor: default; }
    button:focus-visible { outline: 3px solid var(--orange); outline-offset: 2px; }

    .brand { margin-top: 40px; font-size: 0.875rem; color: var(--muted); line-height: 1.6; }
    .brand strong { display: block; color: var(--navy); font-size: 1rem; }
  </style>
</head>
<body>
  <main>
    <svg class="icon" viewBox="0 0 96 96" aria-hidden="true">
      <g fill="none" stroke="#1B2A4A" stroke-width="6" stroke-linecap="round">
        <path d="M14 38a48 48 0 0 1 68 0"/>
        <path d="M27 51a30 30 0 0 1 42 0"/>
        <path d="M39 63a13 13 0 0 1 18 0"/>
      </g>
      <circle cx="48" cy="75" r="4.5" fill="#1B2A4A"/>
      <path d="M18 14L80 82" stroke="#F8FAFC" stroke-width="14" stroke-linecap="round"/>
      <path d="M18 14L80 82" stroke="#FF6B35" stroke-width="6" stroke-linecap="round"/>
    </svg>

    <h1>ইন্টারনেট সংযোগ নেই</h1>
    <p class="desc" id="desc">এই পেজটা এখন দেখানো যাচ্ছে না। ইন্টারনেট ফিরলে আবার চেষ্টা করুন।</p>

    <button id="retry" type="button">আবার চেষ্টা করুন</button>

    <p class="brand"><strong>স্মার্ট ফেনী</strong>প্রয়োজন আপনার, দায়িত্ব আমাদের</p>
  </main>

  <script>
    (function () {
      var retryBtn = document.getElementById('retry');
      var descEl = document.getElementById('desc');

      function tryReload() {
        if (!navigator.onLine) {
          descEl.textContent = 'এখনো ইন্টারনেট সংযোগ পাওয়া যায়নি। মোবাইল ডেটা বা ওয়াই-ফাই চালু করুন।';
          return;
        }
        retryBtn.disabled = true;
        retryBtn.textContent = 'চেষ্টা করছি...';
        window.location.reload();
      }

      retryBtn.addEventListener('click', tryReload);

      // নেট ফিরলে নিজে থেকেই আবার লোড করার চেষ্টা
      window.addEventListener('online', tryReload);
    })();
  </script>
</body>
</html>
